# Simple workflow for deploying static content to GitHub Pages
name: Build and Deploy Documentation Website

defaults:
    run:
      shell: bash

on:
  # Runs on pushes targeting the default branch
  # Also limited to changes to documentation/workflow folders
  push:
    branches: 
      - 'main'
      - 'develop/v*'
    paths:
      - 'Documentation~/**'
      - 'WebsiteDocs~/**'
      - '.github/workflows/**'
  
  # Allow PRs to run this workflow - but don't publish
  pull_request:
    branches:
      - 'main'
      - 'develop/v*'
    paths:
      - 'Documentation~/**'
      - 'WebsiteDocs~/**'
      - '.github/workflows/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

run-name: >
  Building Documentation Website From ${{ github.event_name == 'pull_request' &&
      format('🔀 PR #{0} [{1}] - {2}',
        github.event.pull_request.number,
        github.head_ref,
        github.event.pull_request.title
      )
    ||
      format('➡️ Push [{0}]',
        github.ref_name
      )
  }}

jobs:
  # Build step
  build:
    name: Build Vitepress Documentation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Branch (Builder)
        uses: actions/checkout@v4
        with:
            path: builder-repo
            sparse-checkout: |
              WebsiteDocs~
            lfs: true

      - name: Checkout Main
        uses: actions/checkout@v4 
        with:
            ref: main
            path: main-repo
            sparse-checkout: |
              Documentation~
            lfs: true

      - name: Get Latest Dev Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # get branch list, filter for develop/*, sort by version and grab latest
          LATEST_DEV=$(gh api repos/${{ github.repository }}/branches --paginate \
            --jq '.[] | .name' | grep '^develop/v' | sort -V | tail -n1)

          # Fallback if empty
          if [ -z "$LATEST_DEV" ]; then 
            LATEST_DEV="main"
          fi

          echo "LATEST_DEV_BRANCH=$LATEST_DEV" >> $GITHUB_ENV

      - name: Checkout Dev Branch
        uses: actions/checkout@v4
        with:
            ref: ${{ env.LATEST_DEV_BRANCH }}
            path: dev-repo
            sparse-checkout: |
              Documentation~
              package.json
            lfs: true

      - name: Extract Dev Version from package.json
        run: |
          # Use jq to pull version field
          VERSION=$(jq -r '.version' dev-repo/package.json)
          echo "Found dev version: $VERSION"

          # Save to environment
          echo "DEV_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          cache-dependency-path: '**/WebsiteDocs~/package-lock.json'
          node-version: 24
          cache: 'npm'

      # - name: Set base URL for VitePress build
      #   run: |
      #     REPO_NAME=$(basename $(git rev-parse --show-toplevel))
      #     echo "VITE_BASE_URL=/${REPO_NAME}/" >> $GITHUB_ENV

      - name: Setup Pages
        id: pages # ID for output access
        uses: actions/configure-pages@v4

      - name: Build Main Documentation
        id: build_main
        timeout-minutes: 15
        run: | 

          LOG_FILE="$RUNNER_TEMP/main-documentation-build.log"
          CLEAN_LOG="$RUNNER_TEMP/main-documentation-build-clean.log"

          # Clean any current docs and copy over main
          rm -rf builder-repo/Documentation~
          cp -R main-repo/Documentation~ builder-repo/Documentation~

          cd builder-repo/WebsiteDocs~
          npm ci

          # Don't exit on error
          set +e

          VITE_DEV_VERSION="${{ env.DEV_VERSION }}" \
          VITE_BASE_URL="${{ steps.pages.outputs.base_path }}/" \
          NO_COLOR=1 \
          npm run docs:build 2>&1 | tee "$LOG_FILE"
          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          # Strip ANSI escape/color codes before using the output in GitHub Summary 
          sed -E 's/\x1B\[[0-9;?]*[ -/]*[@-~]//g' "$LOG_FILE" > "$CLEAN_LOG"


          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error title=Main documentation build failed::VitePress failed while building the main documentation. See the job summary for the relevant output."

            {
              echo "## ❌ Main documentation build failed"
              echo
              echo "VitePress exited with code \`$BUILD_STATUS\`."
              echo
              echo "### Relevant errors"
              echo
              echo '```text'

              grep -iE \
                'dead link|dead links|error|failed|cannot find|not found|broken link' \
                "$LOG_FILE" |
                tail -n 50 || tail -n 50 "$CLEAN_LOG"

              echo '```'
              echo
              echo "Open the **Build Main Documentation** step for the complete log."
            } >> "$GITHUB_STEP_SUMMARY"

            exit "$BUILD_STATUS"
          fi

          # Copy docs to final place
          mkdir -p $GITHUB_WORKSPACE/final-dist
          cp -R .vitepress/dist/* $GITHUB_WORKSPACE/final-dist/

          {
            echo "## ✅ Main documentation built successfully"
            echo
            echo "The production documentation was generated successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Development Documentation
        id: build_dev
        timeout-minutes: 15
        run: | 
          LOG_FILE="$RUNNER_TEMP/development-documentation-build.log"
          CLEAN_LOG="$RUNNER_TEMP/development-documentation-build-clean.log"

          # Clean any current docs and copy over dev
          rm -rf builder-repo/Documentation~
          cp -R dev-repo/Documentation~ builder-repo/Documentation~

          # We use the root package.json to get the version
          cp dev-repo/package.json builder-repo/package.json

          cd builder-repo/WebsiteDocs~
          npm ci

          # Don't exit on build errors
          set +e
          
          VITE_DEV_VERSION="${{ env.DEV_VERSION }}" \
          VITE_BASE_URL="${{ steps.pages.outputs.base_path }}/dev/" \
          NO_COLOR=1 \
          npm run docs:build 2>&1 | tee "$LOG_FILE"
          
          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          # Strip ANSI escape/color codes before using the output in GitHub Summary 
          sed -E 's/\x1B\[[0-9;?]*[ -/]*[@-~]//g' "$LOG_FILE" > "$CLEAN_LOG"

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error title=Development documentation build failed::VitePress failed while building documentation from ${{ env.LATEST_DEV_BRANCH }}. See the job summary for the relevant output."

            {
              echo "## ❌ Development documentation build failed"
              echo
              echo "- Branch: \`${{ env.LATEST_DEV_BRANCH }}\`"
              echo "- Version: \`${{ env.DEV_VERSION }}\`"
              echo "- Exit code: \`$BUILD_STATUS\`"
              echo
              echo "### Relevant errors"
              echo
              echo '```text'

              grep -iE \
                'dead link|dead links|error|failed|cannot find|not found|broken link' \
                "$LOG_FILE" |
                tail -n 50 || tail -n 50 "$CLEAN_LOG"

              echo '```'
              echo
              echo "Open the **Build Development Documentation** step for the complete log."
            } >> "$GITHUB_STEP_SUMMARY"

            exit "$BUILD_STATUS"
          fi

          # Copy docs to final place
          mkdir -p $GITHUB_WORKSPACE/final-dist/dev
          cp -R .vitepress/dist/* $GITHUB_WORKSPACE/final-dist/dev

          {
            echo "## ✅ Development documentation built successfully"
            echo
            echo "- Branch: \`${{ env.LATEST_DEV_BRANCH }}\`"
            echo "- Version: \`${{ env.DEV_VERSION }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Documentation Artifact for PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: documentation-preview
          path: ./final-dist

      - name: Upload artifact
        if:   ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload dist folder
          path: './final-dist'

  # Deploy step
  deploy:
    name: Deploy Github Pages
    needs: build
    
    if: >
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      (github.ref_name == 'main' ||
       startsWith(github.ref_name, 'develop/v'))
    
    runs-on: ubuntu-latest

    permissions:
          pages: write
          id-token: write

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy pages to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
